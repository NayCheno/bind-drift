[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binddrift"
version = "0.1.0"
description = "Detect cross-language API and contract drift in Rust-for-Linux safe abstractions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BindDrift Authors" }]
dependencies = []

[project.scripts]
binddrift = "binddrift.cli:main"

[tool.setuptools.packages.find]
include = ["binddrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
